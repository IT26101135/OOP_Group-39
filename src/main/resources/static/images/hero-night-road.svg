<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="heroTitle">
 <title id="heroTitle">A car learning on a quiet night road</title>
 <!-- Headlights glow gently; device motion preferences stop both effects. -->
 <style>
  .headlights { animation: glow 4s ease-in-out infinite alternate; }
  .road-markings { stroke-dasharray: 34 16; animation: travel 3s linear infinite; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
  @keyframes travel { to { stroke-dashoffset: -50; } }
  @media (prefers-reduced-motion: reduce) { .headlights, .road-markings { animation: none; } }
 </style>
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#0b1120"/></linearGradient><linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#334155"/><stop offset="1" stop-color="#111827"/></linearGradient><radialGradient id="light"><stop stop-color="#fbbf24" stop-opacity=".8"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient></defs>
 <rect width="720" height="520" rx="32" fill="url(#sky)"/><circle cx="556" cy="94" r="3" fill="#e0e7ff"/><circle cx="620" cy="150" r="2" fill="#e0e7ff"/><circle cx="104" cy="115" r="2" fill="#e0e7ff"/><circle cx="238" cy="73" r="2" fill="#e0e7ff"/>
 <path d="M0 310 145 210l110 100 135-130 115 130 125-90 90 90v210H0Z" fill="#172033"/><path d="M250 520 312 276h96L480 520Z" fill="url(#road)"/><path class="road-markings" d="m337 520 18-90h10l6 90m-11-176 5-38h8l8 38" stroke="#fbbf24" stroke-linecap="round" stroke-width="8" opacity=".9"/>
 <path class="headlights" d="M329 342 140 408q-24 10-2 20l198-30m60-56 205 61q26 10 1 20l-204-35" fill="url(#light)"/>
 <g transform="translate(250 310)"><path d="m20 68 17-46q8-20 28-20h100q20 0 29 20l18 46 12 9v42h-18v-10H27v10H9V77Z" fill="#6366f1" stroke="#a5b4fc" stroke-width="3"/><path d="m53 28 11-13h93l13 13 12 34H40Z" fill="#bae6fd" opacity=".78"/><path d="M13 71h32v14H9m193-14h-32v14h36" fill="#fde68a"/><circle cx="49" cy="117" r="15" fill="#0b1120" stroke="#94a3b8" stroke-width="5"/><circle cx="177" cy="117" r="15" fill="#0b1120" stroke="#94a3b8" stroke-width="5"/></g>
 <g transform="translate(535 205)"><path d="M0 0h54l-8 65H8Z" fill="#1f2937" stroke="#94a3b8" stroke-width="3"/><path d="M17 19h21v25H17z" fill="#f59e0b"/><text x="27" y="38" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#111827">L</text></g>
 <path d="M78 383v65m20-65v65" stroke="#38bdf8" stroke-width="4" opacity=".65"/><path d="M75 383h28l-14-24Z" fill="#f59e0b"/>
</svg>
