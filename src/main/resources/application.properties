# ============================================================
# MEMBER   : IT26101135 - [Name]
# MODULE   : Shared application configuration
# FILE     : application.properties
# WHAT IT DOES (simple words): Sets the server, file storage and school contact options.
# REAL-LIFE EXAMPLE: A reception notice lists the school's contact and office settings.
# OOP USED : Services receive these settings instead of hard-coding them.
# CRUD     : Configuration only; does not change student records.
# ============================================================
spring.application.name=drivespark-academy

# School contact details. Leave unset lines empty; public pages hide them.
app.school.name=DriveSpark Academy
app.school.email=
app.school.phone=
app.school.address=
app.school.opening-hours=

server.port=8080

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Used by our file repositories in Phase 1.
app.data-directory=./data
app.booking.change-cutoff-hours=${DRIVESPARK_BOOKING_CUTOFF_HOURS:24}
app.attendance.require-lesson-ended=${DRIVESPARK_ATTENDANCE_REQUIRE_LESSON_ENDED:true}
app.demo-seed.enabled=${DRIVESPARK_DEMO_SEED_ENABLED:false}

# IT26101135: Payment instructions use app.school.email; the app does not send email.

# Administrator bootstrap: disabled unless explicitly enabled.
app.admin-seed.enabled=${DRIVESPARK_ADMIN_SEED_ENABLED:false}
app.admin-seed.name=${DRIVESPARK_ADMIN_NAME:System Admin}
app.admin-seed.email=${DRIVESPARK_ADMIN_EMAIL:}
app.admin-seed.password=${DRIVESPARK_ADMIN_PASSWORD:}
