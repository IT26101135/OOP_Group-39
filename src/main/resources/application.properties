spring.application.name=drivespark-academy

server.port=8080

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Used by our file repositories in Phase 1.
app.data-directory=./data

# Administrator bootstrap: disabled unless explicitly enabled.
app.admin-seed.enabled=${DRIVESPARK_ADMIN_SEED_ENABLED:false}
app.admin-seed.name=${DRIVESPARK_ADMIN_NAME:System Admin}
app.admin-seed.email=${DRIVESPARK_ADMIN_EMAIL:}
app.admin-seed.password=${DRIVESPARK_ADMIN_PASSWORD:}